[package]
name = "linodea-desktop"
version = "0.1.5"
description = "Linodea desktop app"
authors = ["Saputra Tanuwijaya"]
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "linodea_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring-core = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Local-network link (see src/lan.rs). tiny_http is a blocking single-purpose
# HTTP server -- this endpoint sees a handful of requests an hour, so a thread
# is cheaper in complexity than pulling an async stack into the module.
tiny_http = "0.12"
if-addrs = "0.13"
# Pairing (see src/pairing.rs). Both are already in the tree transitively, so
# naming them directly adds no new build weight.
rand = "0.9"
sha2 = "0.10"
# Pairing QR (see src/lan.rs). Default features pull in `image` and a full SVG
# renderer; we only need the module matrix and build the path ourselves, so the
# crate is taken bare.
qrcode = { version = "0.14", default-features = false }
# Parsing `scheduled_at` into epoch millis for the phone schedule (see
# src/schedule.rs). Already in the tree via tauri, so naming it directly adds no
# build weight; the default features (clock, serde, wasm shims) are not needed.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Local-network discovery (see src/discovery.rs). A phone pairs against one IP
# address, and a DHCP lease change makes that address wrong; advertising lets it
# find this machine by service name instead. Runs only while the LAN server does.
mdns-sd = "0.21"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
